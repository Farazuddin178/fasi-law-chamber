services:
  # Backend - Python Flask proxy server + Frontend serving
  - type: web
    name: fasi-law-chamber
    env: python
    region: oregon
    plan: free
    buildCommand: bash build.sh
    # IMPORTANT: this overrides the Procfile, so it must carry the concurrency
    # settings itself. It previously used gunicorn's defaults — ONE sync worker —
    # which serialized every backend request in the app: case lookups, cause
    # lists, WhatsApp/email notification calls and the batch scraper all queued
    # behind each other, one at a time. That is why actions felt slow app-wide
    # and notifications arrived long after the event.
    # 2 workers x 4 threads = 8 concurrent requests, matching the Procfile.
    startCommand: gunicorn proxy:app --bind 0.0.0.0:$PORT --timeout 180 --workers 2 --threads 4 --worker-class gthread
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: NODE_VERSION
        value: "22"
